<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大紅茶百科 - フリー百科事典</title>
<style>
  :root{
    --paper:#ffffff;
    --bg:#f6f6f0;
    --ink:#202122;
    --ink-soft:#54595d;
    --rule:#a2a9b1;
    --link:#0645ad;
    --link-visited:#795548;
    --redlink:#ba0000;
    --tea:#7a2e2e;
    --tea-deep:#4a1414;
    --gold:#b08d3f;
    --serif: "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --sans: "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  a{color:var(--link);text-decoration:none;cursor:pointer;}
  a:hover{text-decoration:underline;}
  a.redlink{color:var(--redlink);}

  /* ===== masthead ===== */
  .masthead{
    background:linear-gradient(180deg,var(--tea-deep),var(--tea));
    color:#f3e9d6;
    padding:14px 20px;
    display:flex;align-items:center;gap:14px;
    border-bottom:4px solid var(--gold);
  }
  .masthead .crest{
    width:40px;height:40px;flex:none;
  }
  .masthead h1{
    font-family:var(--serif);
    font-size:22px;letter-spacing:.06em;margin:0;
    font-weight:600;
  }
  .masthead .tagline{
    font-size:11px;opacity:.85;margin-top:2px;letter-spacing:.04em;
  }
  .masthead form{margin-left:auto;display:flex;gap:0;}
  .masthead input[type=text]{
    padding:7px 10px;border:1px solid #d8c9a0;border-radius:2px 0 0 2px;
    font-size:13px;width:200px;background:#fffef9;
  }
  .masthead button{
    padding:7px 12px;border:1px solid var(--gold);background:var(--gold);
    color:#3a2a06;font-weight:600;border-radius:0 2px 2px 0;cursor:pointer;font-size:13px;
  }

  /* ===== layout ===== */
  .wrap{display:flex;max-width:1200px;margin:0 auto;align-items:flex-start;}
  .sidebar{
    width:210px;flex:none;background:#eee9da;border-right:1px solid var(--rule);
    padding:16px 12px;min-height:calc(100vh - 74px);
    font-size:13px;
  }
  .sidebar h3{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--tea);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:18px 0 6px;
  }
  .sidebar h3:first-child{margin-top:0;}
  .sidebar ul{list-style:none;margin:0;padding:0;}
  .sidebar li{margin:3px 0;}
  .sidebar a{display:block;padding:2px 4px;border-radius:2px;}
  .sidebar a:hover{background:#e0d6b8;text-decoration:none;}
  .sidebar .catlabel{
    display:inline-block;font-size:10px;background:var(--rule);color:#fff;border-radius:8px;
    padding:0 6px;margin-left:4px;vertical-align:middle;
  }

  main{flex:1;background:var(--paper);padding:26px 40px 60px;min-height:calc(100vh - 74px);border-right:1px solid var(--rule);}

  .breadcrumb{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .article-title{
    font-family:var(--serif);font-size:32px;border-bottom:3px solid var(--gold);
    padding-bottom:8px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .article-title .kind{font-size:13px;color:var(--ink-soft);font-family:var(--sans);font-weight:400;}
  .article-meta{font-size:12px;color:var(--ink-soft);margin-bottom:18px;font-style:italic;}
  .lead{font-size:15.5px;line-height:1.9;}
  .lead p{margin:0 0 14px;}
  .content h2{
    font-family:var(--serif);font-size:20px;border-bottom:1px solid var(--rule);
    margin:30px 0 10px;padding-bottom:4px;color:var(--tea);
  }
  .content p{margin:0 0 13px;line-height:1.85;font-size:15px;}
  .content ul{margin:0 0 14px;padding-left:28px;line-height:1.8;font-size:15px;}
  .content li{margin-bottom:4px;}
  .stub-box{
    background:#fbf3e0;border:1px solid var(--gold);padding:14px 16px;font-size:13px;
    border-radius:3px;margin-top:20px;color:#5a4b1f;
  }

  /* infobox */
  .infobox{
    float:right;width:270px;margin:0 0 20px 24px;background:#faf8f2;border:1px solid var(--rule);
    font-size:12.5px;
  }
  .infobox .ib-title{
    background:var(--tea);color:#fff;font-family:var(--serif);font-size:16px;
    text-align:center;padding:8px 6px;font-weight:600;
  }
  .infobox .ib-sub{
    text-align:center;font-style:italic;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--rule);
  }
  .infobox table{width:100%;border-collapse:collapse;}
  .infobox td{padding:6px 8px;border-top:1px solid #e3ddc9;vertical-align:top;}
  .infobox td.label{width:38%;font-weight:600;color:var(--ink-soft);background:#f2ecd9;}

  .badges{margin:14px 0;}
  .badge{
    display:inline-block;font-size:11px;background:#efe7cc;border:1px solid var(--gold);
    color:#5a4515;border-radius:10px;padding:2px 10px;margin:0 6px 6px 0;
  }

  .footer-nav{margin-top:36px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-soft);}
  .footer-nav a{margin-right:16px;}

  .toc{
    background:#faf8f2;border:1px solid var(--rule);padding:14px 20px;margin:16px 0 24px;
    display:inline-block;font-size:13.5px;
  }
  .toc-title{font-weight:700;margin-bottom:6px;}
  .toc ol{margin:0;padding-left:20px;}
  .toc li{margin:2px 0;}

  .searchbox-page{padding:40px;}
  .searchresult{margin-bottom:16px;}
  .searchresult a{font-size:17px;}
  .searchresult p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}

  footer.site-footer{
    text-align:center;padding:18px;color:var(--ink-soft);font-size:12px;background:var(--bg);
  }

  @media (max-width:800px){
    .sidebar{display:none;}
    main{padding:18px 16px;border-right:none;}
    .infobox{float:none;width:100%;margin:0 0 18px;}
    .masthead h1{font-size:17px;}
    .masthead input[type=text]{width:110px;}
  }
</style>
</head>

<div class="masthead">

  <div>

    <div class="tagline">大紅茶帝国史をめぐるフリー百科事典 — 誰でも歴史の目撃者になれる</div>
  </div>
  <form onsubmit="return doSearch(event)">
    <input type="text" id="searchInput" placeholder="記事を検索...">
    <button type="submit">検索</button>

</div>

<div class="wrap">
  <div class="sidebar" id="sidebar"></div>
  <main id="main"></main>
</div>

    "## 第二帝政（2026年5月～現在）",

  lead:["**大紅茶帝国第一帝政**は、大紅茶帝国の建国から2026年5月の「[[3条条約]]」による勢力拡大開始までの時代区分。国家としての基盤が固まる一方、軍隊の暴走に起因する内乱をたびたび経験した時期である。"],
  body:[
    "## 建国前史",
    "紅茶皇帝はもともと一介の人狼民であったが、次第に荒らし系の立場に転じていったとされる。旧人狼民らが開いていたボイスチャットに参加したことが、後の建国の直接のきっかけとなった。皇帝は大帝国建設にはまず軍隊が不可欠と考え、人員集めに着手。[[エロ村撲滅運動|エロ村撲滅]]のスローガンのもとに著名人らが次々と参入し、帝国は急速に組織化されていった。",
    "## 内乱と沖紅戦争",
    "建国初期の帝国は、軍隊の暴走という大きな試練に見舞われた。[[沖村玲]]が帝国を侮辱したとの情報を発端に開戦派（[[しも]]・[[ただ兄]]・黒幕）と非開戦派（[[砂山]]・[[のぞみ]]・[[NHK]]）が対立し、最終的に開戦へと至った。これが[[沖紅戦争]]である。戦争中には司令官[[砂山]]の裏切り（[[砂山事件]]）も発生し、内部は大混乱に陥った。最終的に紅茶皇帝自らの交渉により、雑談村不可侵を条件とした終戦がもたらされた。",
    "終戦後、皇帝は軍部改革に着手し、荒帝民の[[アズ]]を法務大臣に登用。戦犯処理の過程で[[ただ兄]]が処分の対象となるなど、内部の粛清と再編が進んだ。同時期、[[しも]]が独自に[[クボ帝国]]を建国していたことが発覚し、[[紅ク独立闘争]]の末に[[しも]]は帝国を去った。その後クボ帝国側から降伏の申し出があり、帝国の植民地として編入された。",
    "## 対外関係の広がり",
    "2025年には[[カラピチ国]]や[[人狼卍會]]をめぐる[[カ卍事変]]など周辺国との緊張が続いた。[[クボ帝国]]の再独立騒動は連合軍による[[クボ帝国口論出兵]]で鎮圧され、[[5.9講和会議]]を経てクボ帝国は消滅した。この時期の対外関係は、後の第二帝政期のような多国間同盟網とは異なり、個別の紛争への都度対応が中心であった。",
    "## 第一帝政の終焉",
    "2026年5月、[[どもたん国]]への進出を皮切りに帝国は「[[3条条約]]」と呼ばれる調印書を用いた本格的な勢力拡大に乗り出す。この画期をもって帝国史は[[大紅茶帝国第二帝政|第二帝政]]へと移行したとされる。"
  ]
});

  body:["この情報を受けた紅茶皇帝は激怒し、自由ラガッジ民主国および大紅茶帝国から、ヒトラーに対し即座に永久追放令を発令した。ヒトラーは[[人狼オンライン国際協和連盟]]の創設者的立場や[[紅東葱三国同盟]]の会議における代理出席など、それまで帝国外交で重要な役割を担っていただけに、この処分は帝国内外に衝撃を与えた。",

art("七・一七国家機密流出事件", {title:"七・一七国家機密流出事件", kind:"事件", categories:["事件","内政"],
  infobox:{subtitle:"", rows:[
    ["日付","2026年7月17日"],
    ["関係人物","[[紅茶皇帝]]（原因）、[[短期]]（機密悪用）、[[輪廻転生]]、会長はった、[[ども]]、[[アズ]]"],
    ["結果","機密悪用による国家一時乗っ取り。翌日にはほぼ沈静化。[[どもたん国|自由ラガッジ民主国]]内で独立論議が高まり、最終的に同国の独立宣言に至る"],
  ]},
  lead:["2026年7月17日、紅茶皇帝の操作ミスにより大紅茶帝国軍の軍事機密や国民情報などの国家機密が流出した事件。この事件は[[どもたん国|自由ラガッジ民主国]]内での独立論議を招く直接の契機となり、最終的に同国の独立宣言へとつながった。"],
  body:[
    "## 事件の概要",
    "流出した機密は短期間のうちに[[短期|短期（人物）]]によって悪用され、国家運営が一時的に乗っ取られる事態となり、金融情報や国家の資源情報に甚大な被害が生じた。前日の「[[七・一六株価改革反対デモ]]」の影響も重なり国民の多くが大混乱に陥ったが、紅茶皇帝らが即座に対応し、翌日には事態はほぼ完全に沈静化した。",
    "## 発端 － 自由ラガッジ民主国の独立論議",
    "この事件の背景には、[[どもたん国|自由ラガッジ民主国]]内で紅茶皇帝率いる大紅茶帝国との関係を問い直す議論が発生していたことがある。発端は、帝国側の弱体化やBOT流出問題などにより、宗主国としての信用が低下しているのではないかという懸念であった。[[輪廻転生]]は「紅茶帝国が崩壊し難民になった」と発言し、大紅茶帝国側でもBOT盗難やトリップ流出、それに伴う国内混乱が起きている状況が共有された。",
    "これを受けて、[[会長はった]]は「植民地であり続けるメリットは薄いのではないか」と考え、独立論が強まった（なお、機密を悪用した[[短期]]は自由ラガッジ民主国の国民ではなく、この独立論議には直接関与していない）。会長はったは、国連の原則として「国家の独立や主権の平等」が尊重されるべきだと主張し、紅茶皇帝が国連加盟国である以上、独立を拒否することは国際的な立場を悪化させる可能性があると説明した。さらに、独立すれば大紅茶帝国と対等な立場で議論できる可能性があるとも述べた。一方で[[ども]]は「すぐ動くより一旦様子を見るべき」と慎重な姿勢を示した。",
    "## 独立宣言",
    "議論の末、[[どもたん国|自由ラガッジ民主国]]は独立を宣言し、周囲からは祝福の声が上がった。独立に際しては、紅茶皇帝との全面対立は避けつつ、必要な場合は相談や外交的対応を行う方針が同国内で共有されており、[[アズ]]も「紅茶に相談してはどうか」と提案するなど、単純な敵対ではなく話し合いによる関係維持も模索されている。事実上、大紅茶帝国への従属関係は継続する形での独立となった。",
    "## その後の余波",
    "機密流出による財産データ削除の混乱は独立宣言後も尾を引き、2026年7月21日には重鎮国民[[酒井せな]]が保証不足を訴えて国民から除名される[[酒樽の穴事件]]が発生している。この一連の流れは、機密流出という単発の事故が、属国の政治的自立化と帝国内の統制強化という二つの帰結を同時にもたらした事例として、帝国史局でもたびたび引用される。"
  ]});

  lead:["**どもたん国**は、2026年5月29日に紅茶皇帝が直接交渉のうえ植民地として獲得した国家。以後複数回の改称・体制変更を経て「**自由ラガッジ民主国**」となった。2026年7月には独立を宣言したが、大紅茶帝国との対立を避ける方針が示されており、事実上の属国関係は現在も続いている。国是として、5月29日の建国記念日を国民全員で祝うことが定められているほか、大紅茶帝国のBOT兵器の傘の下にあるため、外部から攻撃を受けた場合は大紅茶帝国BOT兵器による報復攻撃を受ける体制にある。"],
  body:[
    "## 獲得の経緯",
    "紅茶皇帝自らが赴き交渉した結果、どもたん国は植民地として大紅茶帝国の獲得するところとなった。皇帝はもともとあった役職を自ら改変し、「紅領自由どもたん暫定政権」を樹立。役職作成権を[[ども|村長（現首相）]]に与えたことに感心した皇帝は、見返りとして軍事支援を約束した。",
    "## 体制の変遷",
    "政権樹立後の体制は、首相[[ども]]、副首相・[[心愛]]のもと、立法長に[[コガネ]]、軍事委員長に[[ヒトラー]]が就任するなど整備が進んだ（行政長・司法長は当初空席）。2026年6月2日、皇帝は国民だったE256と会談し、新国家「[[E257結構自由村政府]]」がどもたん国民政府から分離独立する形で樹立された。同日、どもたん国民政府自体も「**自由ラガッジ民主国**」へと改称している（「ラガッジ」はイタリア語で「みんな」を意味するという）。",
    "## 憲法と法律",
    "自由どもたん暫定政権時代には全41条からなる法律が制定され、改称後の自由ラガッジ民主国憲法にも多くが引き継がれた。第38条には「紅茶皇帝様がこの国の中で1番偉い人物である」、第44条には皇帝や帝国への悪口を禁じる旨が明記されるなど、大紅茶帝国への従属関係が明文化されていた。詳細な条文は[[自由ラガッジ民主国憲法]]を参照。",
    "## 副首相人事の混乱（2026年6月1日～）",
    "政権発足直後の2026年6月1日、副首相であった[[心愛]]がエロ村で遊んでいたことが発覚し、これを理由に副首相の座を追われる事態となった。空席となった副首相職は一時的に[[ヒトラー]]（当時の軍事委員長）が兼任するかたちで代行したが、ほどなくして[[カミムシ]]に副首相の座が譲られ、以後カミムシが副首相を務めている。この人事の混乱は、[[大紅茶帝国警察職権乱用叱責事件]]と並び、政権発足初期の自由ラガッジ（当時：どもたん国民政府）における内政上の躓きの一つとして記録されている。",
    "その後の閣僚人事の整備により、行政長には[[千葉下総]]、司法長には[[きりさ]]が就任して長らく空席であった両職が埋まったほか、[[ヒトラー]]の永久追放（[[ヒトラー裏切り事件]]）後の軍事委員長には[[タスク]]が就任した。加えて外務大臣に[[1年前犠牲者]]、宣伝大臣に[[ゲッベルス]]、防衛大臣に[[抹茶猫]]がそれぞれ就任し、内閣は当初の首相・副首相・立法長のみの体制から大きく拡充された。現在は大英帝国など計8ヶ国と同盟関係を結んでいる。",
    "## 戦争と混乱",
    "2026年6月5日には[[葱共戦争]]に巻き込まれ壊滅状態に陥り、[[ども]]らは一時撤退を余儀なくされた。翌日には[[大紅茶帝国警察職権乱用叱責事件]]が発生し、これを機に憲法の見直しが行われている。",
    "## 独立宣言（2026年7月）",
    "[[七・一七国家機密流出事件]]を機に、国内では大紅茶帝国の宗主国としての信用低下を懸念する議論が高まった。[[輪廻転生]]は帝国側の混乱を「崩壊」と評し、[[東人会]]会長の[[会長はった]]も植民地であり続けるメリットの薄さを指摘した（なお、国家機密を悪用した[[短期]]は自由ラガッジ民主国の国民ではなく、独立論議とは別の文脈で登場する人物である）。会長はったは国連原則である国家の独立・主権平等を根拠に独立を主張した。[[ども]]は当初「すぐ動くより一旦様子を見るべき」と慎重姿勢を示したが、最終的に自由ラガッジ民主国の独立宣言が行われ、周囲からは祝福の声が上がった。独立後の方針としては、紅茶皇帝との対立は避けつつ、必要な場合は相談や外交的対応を行うこととされ、[[アズ]]も「紅茶に相談してはどうか」と対話による解決を提案している。詳細は[[七・一七国家機密流出事件]]を参照。",
    "## 酒樽の穴事件（2026年7月21日）",
    "独立宣言後まもなく、[[七・一七国家機密流出事件]]で全国民の財産データが削除された件をめぐり、重鎮国民の[[酒井せな]]が保証の不十分さを訴え、国民をやめたいと発言するなど混乱を招いた。詳細は[[酒樽の穴事件]]を参照。",
    "## STRAIN国家機密流出事件（2026年7月23日～24日）",
    "2026年7月23日、[[名無し帝国]]が反大紅茶帝国の立場を鮮明にすると、これに呼応する形で「STRAIN」を名乗る人物が自由ラガッジ民主国の国家機密及び国家チャットを外部に公開・流出させた。これを受け、独立国としての立場をとる[[ども]]は、大紅茶帝国との関係に過度な期待を寄せることへの警鐘を鳴らしている。詳細は[[STRAIN国家機密流出事件]]を参照。"
  ]});

art("E257結構自由村政府", {title:"E257結構自由村政府", kind:"国家", categories:["国家","属国"],
  infobox:{subtitle:"", rows:[["建国者","E256"],["樹立","2026年6月2日"],["前身","[[どもたん国]]（どもたん国民政府）の一部"],["条約","紅E相互防衛条約・紅E同盟"]]},
  lead:["2026年6月2日、[[どもたん国]]（どもたん国民政府）から分離独立する形で樹立された国家。"],
  body:["紅茶皇帝が、どもたん国民政府の国民であったE256と会談し、国家樹立の方針で一致したことにより誕生した。同日、大紅茶帝国との間に「紅E相互防衛条約」（いずれかが攻撃された場合、他方が戦争に参加する）および「紅E同盟」が締結されている。",
  "同日はまた、どもたん国民政府自体が「[[どもたん国|自由ラガッジ民主国]]」へと改称した日でもあり、皇帝がどもたん国関連の体制整理を集中的に行った一日として記録されている。E257結構自由村政府は、帝国の勢力拡大が既存の属国内部からの分離独立という形でも進んだ事例として位置づけられる。"]});

    "## 建国",

const ALL_TITLES = Object.keys(A);

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function inline(text){
  // bold **text**
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  // links [[Target]] or [[Target|Display]]
  text = text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, disp)=>{
    const label = disp || target;
    const exists = !!A[target];
    const cls = exists ? "" : "redlink";
    return `<a href="#" class="${cls}" data-link="${escapeHtml(target)}" title="${exists? '':'この項目はまだ作成されていません'}">${escapeHtml(label)}</a>`;
  });
  return text;
}

function renderBodyBlock(block){
  if(block.startsWith("## ")) return `<h2>${escapeHtml(block.slice(3))}</h2>`;
  if(block.startsWith("- ")) return null; // handled via grouping below
  return `<p>${inline(block)}</p>`;
}

function renderBody(arr){
  let html = "";
  let listBuf = [];
  const flushList = ()=>{ if(listBuf.length){ html += "<ul>"+listBuf.map(li=>`<li>${inline(li.slice(2))}</li>`).join("")+"</ul>"; listBuf=[]; } };
  arr.forEach(block=>{
    if(block.startsWith("- ")){ listBuf.push(block); }
    else { flushList(); html += renderBodyBlock(block); }
  });
  flushList();
  return html;
}

function renderInfobox(ib, title){
  if(!ib) return "";
  let rows = ib.rows.map(([label,val])=>`<tr><td class="label">${escapeHtml(label)}</td><td>${inline(val)}</td></tr>`).join("");
  return `<div class="infobox">
    <div class="ib-title">${escapeHtml(title)}</div>
    ${ib.subtitle? `<div class="ib-sub">${escapeHtml(ib.subtitle)}</div>`:""}
    <table>${rows}</table>
  </div>`;
}

function attachLinkHandlers(){
  document.querySelectorAll("[data-link]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      const target = el.getAttribute("data-link");
      navigate(target);
    });
  });
  document.querySelectorAll("[data-category]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      location.hash = "cat:" + encodeURIComponent(el.getAttribute("data-category"));
    });
  });
}

function navigate(target){
  if(target === "__home"){ location.hash = ""; return; }
  if(target === "__all"){ location.hash = "all"; return; }
  if(target === "__random"){
    const r = ALL_TITLES[Math.floor(Math.random()*ALL_TITLES.length)];
    location.hash = encodeURIComponent(r);
    return;
  }
  location.hash = encodeURIComponent(target);
}

function doSearch(e){
  e.preventDefault();
  const q = document.getElementById("searchInput").value;
  location.hash = "search:" + encodeURIComponent(q);
  return false;
}

    <li><a href="#" data-link="__home">トップページ</a></li>
    <li><a href="#" data-link="__all">全記事一覧</a></li>
    <li><a href="#" data-link="__random">ランダムな記事</a></li>
  </ul>`;
  Object.entries(groups).forEach(([cat, ids])=>{
    if(!ids.length) return;
    html += `<h3>${cat}<span class="catlabel">${ids.length}</span></h3><ul>`;
    ids.slice(0,10).forEach(id=>{
      html += `<li><a href="#" data-link="${escapeHtml(id)}">${escapeHtml(A[id].title)}</a></li>`;
    });
    html += `</ul>`;
  });
  sb.innerHTML = html;
  attachLinkHandlers();
}

function router(){
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(!hash){ renderHome(); return; }
  if(hash === "all"){ renderAllList(); return; }
  if(hash.startsWith("cat:")){ renderCategoryPage(hash.slice(4)); return; }
  if(hash.startsWith("search:")){ renderSearchResults(hash.slice(7)); return; }
  renderArticle(hash);
}

window.addEventListener("hashchange", router);
buildSidebar();
router();
</script>
</body>
</html>
